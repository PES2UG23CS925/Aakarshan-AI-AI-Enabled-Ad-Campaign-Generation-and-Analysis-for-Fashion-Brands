name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: Backend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: Backend/requirements-dev.txt }
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python ml_artifacts/train.py          # rebuild the model with the CI scikit-learn version
      - run: npm run test:ml
      - run: npm run test:api
      - run: python ml_artifacts/evaluate.py       # regenerates the evaluation figures
      - uses: actions/upload-artifact@v4
        with: { name: ml-evaluation, path: Backend/ml_artifacts/evaluation }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: Frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: http://localhost:5000
