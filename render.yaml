# Render Blueprint: deploys the backend. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: akarshan-ai-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: POLLINATIONS_API_KEY, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
